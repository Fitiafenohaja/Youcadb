[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "youcadb"
dynamic = ["version"]
description = "CLI tool for database diagnostics and configuration for developers (PostgreSQL & MySQL)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "YoucaDB Contributors" }]
keywords = ["database", "postgresql", "mysql", "cli", "diagnostics", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
all = ["youcadb[postgres,mysql]"]
dev = [
    "youcadb[all]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyMySQL>=1.1",
]

[[tool.mypy.overrides]]
module = ["pymysql", "tomllib", "tomli"]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/Fitiafenohaja/Youcadb"
Repository = "https://github.com/Fitiafenohaja/Youcadb"
Changelog = "https://github.com/Fitiafenohaja/Youcadb/blob/main/CHANGELOG.md"
Issues = "https://github.com/Fitiafenohaja/Youcadb/issues"

[project.scripts]
youcadb = "youcadb.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/youcadb"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "TCH",  # flake8-type-checking
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["youcadb"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: integration tests requiring a database",
    "slow: slow-running tests",
]

[tool.coverage.run]
source = ["youcadb"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
