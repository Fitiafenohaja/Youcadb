repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - typer>=0.12
          - questionary>=2.0
          - pymysql
          - types-PyMySQL
          - "psycopg[binary]"
        pass_filenames: false
        entry: mypy src/
        args: []
